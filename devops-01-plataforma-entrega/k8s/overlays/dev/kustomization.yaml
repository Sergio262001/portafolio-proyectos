apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: servicio-api-dev
resources:
  - ../../base
images:
  - name: servicio-api
    newName: ghcr.io/OWNER/servicio-api
    newTag: sha-REEMPLAZAR   # el pipeline lo actualiza con el digest de la imagen
patches:
  - target: { kind: Rollout, name: servicio-api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "100m"
