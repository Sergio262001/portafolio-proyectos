apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: servicio-api
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: servicio-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports: [{ port: 8080, protocol: TCP }]
