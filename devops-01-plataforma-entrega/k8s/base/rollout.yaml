apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: servicio-api
  labels: { app.kubernetes.io/name: servicio-api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: servicio-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: servicio-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: servicio-api:latest   # el overlay reemplaza la imagen por digest
          ports: [{ containerPort: 8080, name: http }]
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 300m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # deja que el balanceador deje de enviar tráfico
  strategy:
    canary:
      canaryService: servicio-api-canary
      stableService: servicio-api
      trafficRouting: {}          # sin malla: el reparto lo hace el número de réplicas
      steps:
        - setWeight: 20
        - pause: { duration: 2m }
        - analysis:
            templates: [{ templateName: tasa-error-y-latencia }]
        - setWeight: 50
        - pause: { duration: 2m }
        - analysis:
            templates: [{ templateName: tasa-error-y-latencia }]
        - setWeight: 100
