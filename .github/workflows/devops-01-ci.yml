name: devops-01 CI/CD

on:
  push:
    branches: [main]
    paths: ["devops-01-plataforma-entrega/**", ".github/workflows/devops-01-ci.yml"]
  pull_request:
    paths: ["devops-01-plataforma-entrega/**", ".github/workflows/devops-01-ci.yml"]

permissions:
  contents: read

concurrency:
  group: devops-01-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: devops-01-plataforma-entrega/app/servicio-api
  # IMAGE se calcula en cada job: Docker exige el nombre en minúsculas
  # y el usuario de GitHub (Sergio262001) tiene mayúsculas.

jobs:
  pruebas:
    name: Lint, pruebas y validación de manifiestos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-01-plataforma-entrega
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pruebas de la API
        working-directory: devops-01-plataforma-entrega/app/servicio-api
        run: npm test

      - name: Validar sintaxis de los manifiestos
        run: |
          pip install -q yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" k8s gitops observabilidad

      - name: Renderizar Kustomize (prod)
        run: |
          curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          ./kustomize build k8s/overlays/prod > /tmp/prod.yaml

      - name: Políticas con Conftest
        run: |
          curl -sL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          ./conftest test --policy policies/opa /tmp/prod.yaml

  imagen:
    name: Build, SBOM y firma de la imagen
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # firma keyless con cosign
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/servicio-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Firmar la imagen por digest
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

  despliegue-dev:
    name: Actualizar overlay dev (GitOps)
    needs: imagen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/servicio-api" >> "$GITHUB_ENV"

      - name: Fijar la imagen por digest en el overlay
        run: |
          (cd /tmp && curl -sL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash && sudo mv kustomize /usr/local/bin/)
          cd devops-01-plataforma-entrega/k8s/overlays/dev
          kustomize edit set image servicio-api="${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ needs.imagen.outputs.digest }}

      - name: Commit del cambio para que Argo CD sincronice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devops-01-plataforma-entrega/k8s/overlays/dev
          git diff --cached --quiet || git commit -m "chore(dev): desplegar ${{ github.sha }}"
          git push
